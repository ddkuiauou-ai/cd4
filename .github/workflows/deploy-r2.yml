name: Publish CD to R2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        type: choice
        options:
          [status, provision, full, daily, verify, promote, resume, smoke]
        default: status
      candidate_id:
        description: Reviewed candidate ID for promote
        type: string
  schedule:
    # 17:30 Asia/Seoul on weekdays and 09:00 Asia/Seoul on Saturday.
    - cron: "30 8 * * 1-5"
    - cron: "0 0 * * 6"

permissions:
  contents: read

jobs:
  route:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.task.outputs.mode }}
      runner: ${{ steps.runner.outputs.labels }}
    steps:
      - name: Choose release operation
        id: task
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          OPERATION: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" = schedule ]]; then
            case "$CRON" in
              '0 0 * * 6')
                [[ "$(TZ=Asia/Seoul date +%u)" = 6 ]] && (( 10#$(TZ=Asia/Seoul date +%d) <= 7 )) || exit 0
                OPERATION=verify ;;
              '30 8 * * 1-5')
                OPERATION=daily ;;
              *)
                exit 1 ;;
            esac
          fi
          printf 'mode=%s\n' "$OPERATION" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted branch for resume
        if: steps.task.outputs.mode == 'resume'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm for resume
        if: steps.task.outputs.mode == 'resume'
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js for resume
        if: steps.task.outputs.mode == 'resume'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pinned dependencies for resume
        if: steps.task.outputs.mode == 'resume'
        run: pnpm install --prod=false --frozen-lockfile

      - name: Resolve interrupted operation
        if: steps.task.outputs.mode == 'resume'
        id: state
        shell: bash
        env:
          R2_BUCKET_NAME: cd-static
          R2_STATE_BUCKET_NAME: cd-static-state
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: STATIC_RELEASE_HOME="$RUNNER_TEMP/cd4-status" node scripts/deploy-static-r2.cjs --mode status

      - name: Choose runner
        if: steps.task.outputs.mode != ''
        id: runner
        shell: bash
        env:
          MODE: ${{ steps.task.outputs.mode }}
          PENDING_MODE: ${{ steps.state.outputs.pending_mode }}
          ACTIVE_PORTABLE: ${{ steps.state.outputs.active_portable }}
        run: |
          set -euo pipefail
          labels='["self-hosted","macOS","X64"]'
          if [[ "$MODE" = daily || "$MODE" = status || "$MODE" = smoke || ( "$MODE" = resume && ( "$PENDING_MODE" = daily || ( -z "$PENDING_MODE" && "$ACTIVE_PORTABLE" = true ) ) ) ]]; then
            labels='"ubuntu-latest"'
          fi
          printf 'labels=%s\n' "$labels" >> "$GITHUB_OUTPUT"

  release:
    needs: route
    if: needs.route.outputs.mode != ''
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    concurrency:
      # Mac runner availability must not queue the hosted jobs. R2's
      # conditional current.json update still chooses a single pending writer.
      group: ${{ needs.route.outputs.mode == 'status' && 'cd-r2-status' || needs.route.outputs.mode == 'smoke' && 'cd-r2-smoke' || needs.route.outputs.runner == '"ubuntu-latest"' && 'cd-r2-hosted' || 'cd-r2-mac' }}
      cancel-in-progress: false
    timeout-minutes: 300
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: ${{ needs.route.outputs.runner == '"ubuntu-latest"' && '--max-old-space-size=3072' || '--max-old-space-size=12288' }}

      # Mac 기본값은 ~/.local/state/cd4-r2다. 호스팅 러너는 RUNNER_TEMP를 사용한다.
      STATIC_RELEASE_HOME: ""

      # 사이트 파일과 비공개 배포 기록을 저장할 R2 버킷
      R2_BUCKET_NAME: cd-static
      R2_STATE_BUCKET_NAME: cd-static-state
      # 선택 사항. 공개 후 GitHub Variables에 주소를 넣으면 smoke가 방문자 URL도 검사한다.
      R2_PUBLIC_ORIGIN: ${{ vars.R2_PUBLIC_ORIGIN }}

      # R2 인증용 GitHub Secrets. S3 접속 주소는 계정 ID로 결정된다.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # 두 러너가 같은 인증서를 검증한다. TLS 전용 주소가 있으면 기본 주소를 대신한다.
      POSTGRES_HOST: ${{ secrets.POSTGRES_TLS_HOST || secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_TLS_PORT || secrets.POSTGRES_PORT }}
      POSTGRES_TLS_CA: ${{ vars.POSTGRES_TLS_CA }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set dedicated release directory
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const hostDirectory = process.env.RUNNER_ENVIRONMENT === 'github-hosted'
            ? path.join(process.env.RUNNER_TEMP, 'cd4-r2')
            : path.join(os.homedir(), '.local', 'state', 'cd4-r2');
          const dir = process.env.STATIC_RELEASE_HOME || hostDirectory;
          if (!path.isAbsolute(dir)) throw new Error('STATIC_RELEASE_HOME must be an absolute path');
          fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
          const home = fs.realpathSync(dir);
          const relative = path.relative(fs.realpathSync(process.env.GITHUB_WORKSPACE), home);
          const outsideCheckout = path.isAbsolute(relative) || relative.split(path.sep)[0] === '..';
          if (!outsideCheckout || home === path.parse(home).root || /[\r\n]/.test(home)) {
            throw new Error('Choose a dedicated release directory outside the checkout');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `STATIC_RELEASE_HOME=${home}${os.EOL}`);

      - name: Install pinned dependencies
        run: pnpm install --prod=false --frozen-lockfile

      - name: Check hosted PostgreSQL access
        if: needs.route.outputs.mode == 'status'
        run: node scripts/check-static-db-access.cjs --authenticated --report-only

      - name: Resolve last successful release
        if: needs.route.outputs.mode == 'verify'
        id: state
        run: node scripts/deploy-static-r2.cjs --mode status

      - name: Pin independent verification to published code
        if: needs.route.outputs.mode == 'verify'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.state.outputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git checkout --detach "$RELEASE_COMMIT"
          pnpm install --prod=false --frozen-lockfile

      - name: Build, verify or promote the release
        shell: bash
        env:
          MODE: ${{ needs.route.outputs.mode }}
          STATIC_RELEASE_POSTGRES_TLS: verify-full
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          args=(--mode "$MODE")
          if [[ "$MODE" = promote ]]; then
            [[ "$CANDIDATE_ID" =~ ^[0-9a-f]{64}$ ]] || exit 1
            args+=(--candidate-id "$CANDIDATE_ID")
          fi
          node scripts/deploy-static-r2.cjs "${args[@]}"

      - name: Inspect registered full candidates
        if: needs.route.outputs.mode == 'status'
        run: node .github/scripts/inspect-r2-candidates.cjs
