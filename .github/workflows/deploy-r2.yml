name: Publish CD to R2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        type: choice
        options:
          [status, provision, full, daily, verify, promote, resume, smoke]
        default: status
      candidate_id:
        description: Reviewed candidate ID for promote
        type: string
      frozen_input:
        description: Optional verified frozen input (absolute runner path, first full only)
        type: string
      frozen_day:
        description: Verified frozen input business day
        type: string
      frozen_commit:
        description: Commit used to verify the frozen input
        type: string
  schedule:
    # 17:30 Asia/Seoul on weekdays and 09:00 Asia/Seoul on Saturday.
    - cron: "30 8 * * 1-5"
    - cron: "0 0 * * 6"

permissions:
  contents: read

concurrency:
  group: cd-r2-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # 일일 배포는 직전 기준본을 보관한 Mac에서 실행한다.
    runs-on: ${{ fromJSON(inputs.mode == 'status' && '"ubuntu-latest"' || '["self-hosted","macOS","X64"]') }}
    timeout-minutes: 300
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=12288"

      # 러너 계정의 홈 아래 .local/state/cd4-r2를 사용한다. 전용 디스크를 쓸 때만 절대 경로를 적는다.
      STATIC_RELEASE_HOME: ""

      # 사이트 파일과 비공개 배포 기록을 저장할 R2 버킷
      R2_BUCKET_NAME: cd-static
      R2_STATE_BUCKET_NAME: cd-static-state
      # 선택 사항. 공개 후 GitHub Variables에 주소를 넣으면 smoke가 방문자 URL도 검사한다.
      R2_PUBLIC_ORIGIN: ${{ vars.R2_PUBLIC_ORIGIN }}

      # R2 인증용 GitHub Secrets. S3 접속 주소는 계정 ID로 결정된다.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # 업무 DB 접속용 GitHub Secrets
      POSTGRES_HOST: ${{ inputs.mode == 'status' && secrets.POSTGRES_TLS_HOST || secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ inputs.mode == 'status' && secrets.POSTGRES_TLS_PORT || secrets.POSTGRES_PORT }}
      POSTGRES_TLS_CA: ${{ inputs.mode == 'status' && vars.POSTGRES_TLS_CA || '' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Choose release operation
        id: task
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          OPERATION: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" = schedule ]]; then
            if [[ "$CRON" = '0 0 * * 6' ]]; then
              [[ "$(TZ=Asia/Seoul date +%u)" = 6 ]] && (( 10#$(TZ=Asia/Seoul date +%d) <= 7 )) || exit 0
              OPERATION=verify
            else
              OPERATION=daily
            fi
          fi
          printf 'mode=%s\n' "$OPERATION" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted branch
        if: steps.task.outputs.mode != ''
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        if: steps.task.outputs.mode != ''
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        if: steps.task.outputs.mode != ''
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set persistent runner directory
        if: steps.task.outputs.mode != ''
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const dir = process.env.STATIC_RELEASE_HOME || path.join(os.homedir(), '.local', 'state', 'cd4-r2');
          if (!path.isAbsolute(dir)) throw new Error('STATIC_RELEASE_HOME must be an absolute path');
          fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
          const home = fs.realpathSync(dir);
          const relative = path.relative(fs.realpathSync(process.env.GITHUB_WORKSPACE), home);
          const outsideCheckout = path.isAbsolute(relative) || relative.split(path.sep)[0] === '..';
          if (!outsideCheckout || home === path.parse(home).root || /[\r\n]/.test(home)) {
            throw new Error('Choose a dedicated release directory outside the checkout');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `STATIC_RELEASE_HOME=${home}${os.EOL}`);

      - name: Install pinned dependencies
        if: steps.task.outputs.mode != ''
        run: pnpm install --prod=false --frozen-lockfile

      - name: Check hosted PostgreSQL access
        if: steps.task.outputs.mode == 'status'
        run: node scripts/check-static-db-access.cjs --authenticated --report-only

      - name: Resolve last successful release
        if: steps.task.outputs.mode == 'verify'
        id: state
        run: node scripts/deploy-static-r2.cjs --mode status

      - name: Pin independent verification to published code
        if: steps.task.outputs.mode == 'verify'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.state.outputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git checkout --detach "$RELEASE_COMMIT"
          pnpm install --prod=false --frozen-lockfile

      - name: Build, verify or promote the release
        if: steps.task.outputs.mode != ''
        shell: bash
        env:
          MODE: ${{ steps.task.outputs.mode }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          FROZEN_INPUT: ${{ inputs.frozen_input }}
          FROZEN_DAY: ${{ inputs.frozen_day }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
        run: |
          set -euo pipefail
          args=(--mode "$MODE")
          if [[ "$MODE" = promote ]]; then
            [[ "$CANDIDATE_ID" =~ ^[0-9a-f]{64}$ ]] || exit 1
            args+=(--candidate-id "$CANDIDATE_ID")
          fi
          if [[ -n "$FROZEN_INPUT" ]]; then
            [[ "$MODE" = full && "$FROZEN_DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$FROZEN_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
            args+=(--input "$FROZEN_INPUT" --day "$FROZEN_DAY" --input-commit "$FROZEN_COMMIT")
          fi
          node scripts/deploy-static-r2.cjs "${args[@]}"
